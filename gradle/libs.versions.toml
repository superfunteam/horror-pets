# Versions are the latest stable at execution time (2026-10-20), EXCEPT the AndroidX/Media3 entries
# marked "minSdk 22 cap". Those libraries raised their own minSdk to 23 in Dec 2025 (Compose 1.10,
# activity 1.12, lifecycle 2.10, datastore 1.2, media3 1.9, tv-material 1.1) and Compose 1.12 /
# lifecycle 2.11 also need compileSdk 37. The project targets minSdk 22 (Fire OS 5) on compileSdk 36,
# so each is pinned to the newest release that still supports both. To move up, raise minSdk to 23 in
# app/build.gradle.kts and bump these to: composeBom 2026.06.01 (2026.08.00+ also need compileSdk 37),
# tvMaterial 1.1.0, activityCompose 1.13.0, lifecycle 2.10.0 (2.11.0 needs compileSdk 37),
# datastore 1.2.1, media3 1.11.1.
[versions]
agp = "9.4.1"
kotlin = "2.4.21"
# minSdk 22 cap: Compose 1.9.5 is the last Compose release with minSdk 21.
composeBom = "2025.11.01"
# minSdk 22 cap: 1.1.0 needs minSdk 23.
tvMaterial = "1.0.1"
# minSdk 22 cap: 1.12.0+ needs minSdk 23.
activityCompose = "1.11.0"
# minSdk 22 cap: 2.10.0+ needs minSdk 23.
lifecycle = "2.9.4"
# minSdk 22 cap: 1.2.0+ needs minSdk 23.
datastore = "1.1.7"
# minSdk 22 cap: 1.9.0+ needs minSdk 23.
media3 = "1.8.1"
coroutines = "1.11.0"
serializationJson = "1.12.0"
junit = "4.13.2"

[libraries]
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-tv-material = { module = "androidx.tv:tv-material", version.ref = "tvMaterial" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
